name: SDK Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows-build-tools:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Build-Tools
        shell: pwsh
        run: |
          cmd /c "echo y| sdkmanager.bat --licenses" | Out-Null
          sdkmanager.bat "build-tools;36.0.0"

      - name: Package Windows Build-Tools
        shell: pwsh
        run: |
          tar -C "$env:ANDROID_SDK_ROOT" -czf windows-build-tools-36.tar.gz build-tools/36.0.0 licenses

      - name: Upload Windows Build-Tools
        uses: actions/upload-artifact@v4
        with:
          name: android-windows-buildtools-36
          if-no-files-found: error
          path: windows-build-tools-36.tar.gz
          retention-days: 1
