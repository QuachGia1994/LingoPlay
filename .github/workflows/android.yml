name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_LINGOPLAY_TRANSLATION_API_BASE_URL: ${{ vars.LINGOPLAY_TRANSLATION_API_BASE_URL }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Verify translation backend wiring
        shell: bash
        run: test -n "$ORG_GRADLE_PROJECT_LINGOPLAY_TRANSLATION_API_BASE_URL"

      - name: Verify release privacy/security config
        working-directory: .
        run: python3 scripts/verify_release_privacy.py

      - name: Verify product contract and architecture
        working-directory: .
        run: |
          python3 scripts/verify_product_contract.py
          python3 scripts/verify_architecture.py
          python3 scripts/test_stage22_runtime_integrity.py

      - name: Backend translation tests
        working-directory: backend
        run: |
          npm test
          npm run check

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build optimized release
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify 16 KB native alignment
        working-directory: .
        run: |
          python3 scripts/verify_android_release.py android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign installable test APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks keystores/lingoplay-device-test.p12 \
            --ks-type PKCS12 \
            --ks-key-alias lingoplay-device-test \
            --ks-pass pass:android --key-pass pass:android \
            --out app/build/outputs/apk/release/LingoPlay-release-test.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/LingoPlay-release-test.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-Android-debug-apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release test APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-Android-release-test-apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: android/app/build/outputs/apk/release/LingoPlay-release-test.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-Android-release-aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Android reports
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-Android-reports
          if-no-files-found: error
          retention-days: 7
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-debug.html
