name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LINGOPLAY_TRANSLATION_API_BASE_URL: ${{ vars.LINGOPLAY_TRANSLATION_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify translation backend wiring
        run: test -n "$LINGOPLAY_TRANSLATION_API_BASE_URL"

      - name: Verify release privacy/security config
        run: |
          python3 scripts/verify_release_privacy.py
          python3 scripts/verify_ios_source_hardening.py
          plutil -lint ios/LingoPlay/PrivacyInfo.xcprivacy

      - name: Verify product contract and architecture
        run: |
          python3 scripts/verify_product_contract.py
          python3 scripts/verify_architecture.py
          python3 -m unittest discover -s scripts -p 'test_ios_bundle_metadata.py' -v
          python3 scripts/test_stage18_runtime_integrity.py

      - name: Install pinned project toolchain
        run: |
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate Xcode project and install official ML Kit pod
        working-directory: ios
        run: |
          xcodegen generate
          pod install

      - name: Resolve Swift packages
        run: xcodebuild -workspace ios/LingoPlay.xcworkspace -scheme LingoPlay -resolvePackageDependencies

      - name: Verify effective Release build settings
        run: |
          mkdir -p build/reports
          xcodebuild \
            -workspace ios/LingoPlay.xcworkspace \
            -scheme LingoPlay \
            -configuration Release \
            -sdk iphoneos \
            LINGOPLAY_TRANSLATION_API_BASE_URL="$LINGOPLAY_TRANSLATION_API_BASE_URL" \
            -showBuildSettings > build/reports/ios-release-build-settings.txt
          python3 scripts/verify_ios_build_settings.py build/reports/ios-release-build-settings.txt

      - name: Run iOS unit tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')
          xcodebuild \
            -workspace ios/LingoPlay.xcworkspace \
            -scheme LingoPlay \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/ios-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            LINGOPLAY_TRANSLATION_API_BASE_URL="$LINGOPLAY_TRANSLATION_API_BASE_URL" \
            test

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -workspace ios/LingoPlay.xcworkspace
          -scheme LingoPlay
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          LINGOPLAY_TRANSLATION_API_BASE_URL="$LINGOPLAY_TRANSLATION_API_BASE_URL"
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/LingoPlay.app build/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/LingoPlay-unsigned.ipa

      - name: Preserve resolved CocoaPods lock
        run: cp ios/Podfile.lock build/reports/Podfile.lock

      - name: Verify iOS binary, dSYM, and size budgets
        run: >-
          python3 scripts/verify_ios_binary.py
          build/ios/Build/Products/Release-iphoneos/LingoPlay.app
          --ipa build/LingoPlay-unsigned.ipa
          --dsym build/ios/Build/Products/Release-iphoneos/LingoPlay.app.dSYM
          --report build/reports/ios-release-audit.txt
          --translation-base-url "$LINGOPLAY_TRANSLATION_API_BASE_URL"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-iOS-unsigned-IPA
          if-no-files-found: error
          path: build/LingoPlay-unsigned.ipa

      - name: Upload iOS dSYM
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-iOS-dSYM
          if-no-files-found: error
          retention-days: 7
          path: build/ios/Build/Products/Release-iphoneos/LingoPlay.app.dSYM

      - name: Upload iOS release reports
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-iOS-release-reports
          if-no-files-found: error
          retention-days: 7
          path: build/reports/
