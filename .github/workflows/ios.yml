name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify release privacy/security config
        run: |
          python3 scripts/verify_release_privacy.py
          plutil -lint ios/LingoPlay/PrivacyInfo.xcprivacy

      - name: Verify product contract and architecture
        run: |
          python3 scripts/verify_product_contract.py
          python3 scripts/verify_architecture.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -project ios/LingoPlay.xcodeproj -scheme LingoPlay -resolvePackageDependencies

      - name: Run iOS unit tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')
          xcodebuild \
            -project ios/LingoPlay.xcodeproj \
            -scheme LingoPlay \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/ios-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -project ios/LingoPlay.xcodeproj
          -scheme LingoPlay
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/LingoPlay.app build/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/LingoPlay-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LingoPlay-iOS-unsigned-IPA
          if-no-files-found: error
          path: build/LingoPlay-unsigned.ipa
