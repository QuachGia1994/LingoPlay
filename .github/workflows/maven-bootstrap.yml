name: Maven Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: pwsh
        run: |
          cmd /c "echo y| sdkmanager.bat --licenses" | Out-Null
          sdkmanager.bat "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Prefetch resolved Maven artifacts only
        shell: pwsh
        run: |
          @'
          gradle.afterProject { project, state ->
              if (project.path == ':app') {
                  project.tasks.register('prefetchArtifacts') {
                      doLast {
                          ['debugCompileClasspath', 'debugRuntimeClasspath', 'releaseCompileClasspath', 'releaseRuntimeClasspath'].each { name ->
                              def files = project.configurations.getByName(name).files
                              println("Resolved ${project.path}:${name} -> ${files.size()} files")
                          }
                          def aapt2Dep = project.dependencies.create('com.android.tools.build:aapt2:9.3.2-15703166:windows@jar')
                          def aapt2Config = project.configurations.detachedConfiguration(aapt2Dep)
                          println("Resolved AAPT2 Windows -> ${aapt2Config.files.size()} files")
                          ['kotlin-build-tools-compat', 'kotlin-build-tools-impl'].each { module ->
                              def kotlinDep = project.dependencies.create("org.jetbrains.kotlin:${module}:2.3.21")
                              def kotlinConfig = project.configurations.detachedConfiguration(kotlinDep)
                              println("Resolved ${module} -> ${kotlinConfig.files.size()} files")
                          }
                          project.configurations.findAll { cfg ->
                              cfg.canBeResolved && (cfg.name.toLowerCase().contains('kotlin') || cfg.name.toLowerCase().contains('lint'))
                          }.each { cfg ->
                              println("Resolved ${project.path}:${cfg.name} -> ${cfg.files.size()} files")
                          }
                      }
                  }
              }
          }
          '@ | Set-Content -Encoding UTF8 prefetch.init.gradle
          ./gradlew.bat :app:prefetchArtifacts -I prefetch.init.gradle --stacktrace

      - name: Stop Gradle before cache upload
        shell: pwsh
        run: ./gradlew.bat --stop

      - name: Upload Maven cache
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-modules-2
          if-no-files-found: error
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-2.107
          include-hidden-files: true
          retention-days: 1
