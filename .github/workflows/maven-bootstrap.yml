name: Maven Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: pwsh
        run: |
          cmd /c "echo y| sdkmanager.bat --licenses" | Out-Null
          sdkmanager.bat "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Prefetch Gradle plugins and Maven dependencies only
        shell: pwsh
        run: |
          ./gradlew.bat :app:dependencies --configuration debugCompileClasspath --stacktrace
          ./gradlew.bat :app:dependencies --configuration debugRuntimeClasspath --stacktrace
          ./gradlew.bat :app:dependencies --configuration releaseCompileClasspath --stacktrace
          ./gradlew.bat :app:dependencies --configuration releaseRuntimeClasspath --stacktrace

      - name: Stop Gradle before cache upload
        shell: pwsh
        run: ./gradlew.bat --stop

      - name: Upload Maven cache
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-modules-2
          if-no-files-found: error
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-2.107
          include-hidden-files: true
          retention-days: 1
